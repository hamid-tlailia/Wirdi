plugins {
    id "com.android.application"
}

// مفتاح التوقيع خارج المستودع (المستودع عام): android/keystore.properties
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "com.wirdi.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.wirdi.app"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/webAssets"
    }
}

// نسخ تطبيق الويب (من جذر المستودع) داخل التطبيق
def syncWeb = tasks.register("syncWeb", Sync) {
    from(rootProject.file("..")) {
        include "index.html", "styles.css", "app.js", "data.js", "prayer.js", "icons/**", "fonts/**"
    }
    into "$buildDir/generated/webAssets/www"
}
tasks.named("preBuild") { dependsOn syncWeb }
